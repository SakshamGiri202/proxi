<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#173d39"/>
      <stop offset="100%" style="stop-color:#0d2825"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#277b6e;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#173d39;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Glow circles -->
  <circle cx="200" cy="315" r="300" fill="url(#glow)" opacity="0.6"/>
  <circle cx="1050" cy="200" r="250" fill="url(#glow)" opacity="0.4"/>

  <!-- AI Avatar box -->
  <rect x="80" y="220" width="90" height="90" rx="22" fill="#277b6e"/>
  <text x="125" y="276" font-family="sans-serif" font-size="38" fill="white" text-anchor="middle">✦</text>

  <!-- Brand name -->
  <text x="195" y="260" font-family="'Manrope', sans-serif" font-weight="800" font-size="80" fill="white" letter-spacing="-4">proxi</text>
  <text x="535" y="260" font-family="sans-serif" font-size="80" fill="#d57d5c">.</text>

  <!-- Tagline -->
  <text x="80" y="345" font-family="sans-serif" font-size="28" fill="#aec6c0" letter-spacing="0.5">AI that represents your work in every meeting.</text>

  <!-- Bottom pill badges -->
  <rect x="80" y="400" width="230" height="44" rx="22" fill="#ffffff18"/>
  <text x="195" y="428" font-family="sans-serif" font-size="17" fill="#86c8b5" text-anchor="middle">🎙 Bolna Voice AI</text>

  <rect x="330" y="400" width="220" height="44" rx="22" fill="#ffffff18"/>
  <text x="440" y="428" font-family="sans-serif" font-size="17" fill="#86c8b5" text-anchor="middle">⚡ Live Briefings</text>

  <rect x="570" y="400" width="230" height="44" rx="22" fill="#ffffff18"/>
  <text x="685" y="428" font-family="sans-serif" font-size="17" fill="#86c8b5" text-anchor="middle">🤝 Q&amp;A Auto-Answer</text>

  <!-- Right side: simulated meeting card -->
  <rect x="740" y="140" width="400" height="350" rx="16" fill="white" opacity="0.06" stroke="#ffffff22" stroke-width="1"/>
  <rect x="760" y="165" width="360" height="60" rx="10" fill="#ffffff0a"/>
  <circle cx="795" cy="195" r="18" fill="#277b6e"/>
  <text x="795" y="202" font-family="sans-serif" font-size="14" fill="white" text-anchor="middle">P</text>
  <text x="825" y="188" font-family="sans-serif" font-size="13" font-weight="600" fill="#c5e0da">Proxi AI</text>
  <text x="825" y="207" font-family="sans-serif" font-size="11" fill="#6fa89e">Delivering briefing...</text>
  <rect x="760" y="240" width="360" height="8" rx="4" fill="#ffffff15"/>
  <rect x="760" y="258" width="280" height="8" rx="4" fill="#ffffff10"/>
  <rect x="760" y="276" width="320" height="8" rx="4" fill="#ffffff10"/>
  <rect x="760" y="310" width="360" height="60" rx="10" fill="#d47b5c18"/>
  <text x="940" y="346" font-family="sans-serif" font-size="12" fill="#d47b5c" text-anchor="middle">● LIVE BRIEFING</text>
  <rect x="760" y="390" width="170" height="40" rx="8" fill="#277b6e"/>
  <text x="845" y="415" font-family="sans-serif" font-size="13" fill="white" text-anchor="middle">Deliver Briefing</text>
  <rect x="945" y="390" width="175" height="40" rx="8" fill="#ffffff0a" stroke="#ffffff22" stroke-width="1"/>
  <text x="1032" y="415" font-family="sans-serif" font-size="13" fill="#86c8b5" text-anchor="middle">Ask Proxi</text>

  <!-- Footer -->
  <text x="80" y="590" font-family="sans-serif" font-size="16" fill="#4d706a">Built with Bolna AI · React · Supabase · Vite</text>
</svg>
